[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "furnace"
version = "0.5.0"
description = "Standalone blocklist server that publishes IP and domain lists (EDLs) for firewalls"
requires-python = ">=3.9"
dependencies = ["Flask>=2.0,<4", "gunicorn>=20.1,<24"]

[project.scripts]
furnace = "furnace.admin:main"

[tool.setuptools]
packages = ["furnace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
