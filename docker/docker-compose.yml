# Furnace with Docker: two hosts, one container each, one shared IP (keepalived).
# Use this file on BOTH hosts. Change the values marked CHANGE, then: docker compose up -d
#
# All addresses below are FAKE examples from the documentation ranges.
# First start: the leader makes the certificate and the secrets, and the follower bundle
# ./config/furnace-peer-bundle.tar.gz. Copy that file to ./config/ on the follower host
# (it is secret; the follower deletes it after reading), then start the follower.
# Then make the first API token and the list login on the leader:
#   docker exec -it furnace furnace token add api
#   docker exec -it furnace furnace edl-user add paloalto
services:
  furnace:
    image: furnace:0.8.0
    container_name: furnace
    restart: unless-stopped
    network_mode: host            # keepalived moves the shared IP on the host's network card
    cap_add: [NET_ADMIN, NET_RAW] # only for keepalived (the shared IP and VRRP)
    stop_grace_period: 20s
    environment:
      FURNACE_ROLE: leader                # CHANGE: leader on one host, follower on the other
      FURNACE_THIS_IP: 192.0.2.11         # CHANGE: this host's IP
      FURNACE_PEER_IP: 192.0.2.12         # CHANGE: the other host's IP
      FURNACE_SHARED_IP: 192.0.2.10       # CHANGE: the shared IP (VIP) everyone uses
      FURNACE_SHARED_IP_PREFIX: "24"
      # FURNACE_INTERFACE: eth0           # empty = the card that has FURNACE_THIS_IP
      FURNACE_API_ALLOW_FROM: any         # or IPs and ranges, separated by commas
      FURNACE_LISTS_ALLOW_FROM: any
      FURNACE_VRRP_ROUTER_ID: "51"        # 1-255, the same on both hosts, unique on this network
      FURNACE_ARCHIVE_AFTER_DAYS: "30"
      FURNACE_MAX_IPS: "50000"
      FURNACE_MAX_DOMAINS: "50000"
      TZ: UTC                             # the backup runs at 01:30 and the cleanup at 02:30 in this time zone
    volumes:
      - ./config:/etc/furnace             # certificate and secrets (keep it private)
      - ./data:/var/lib/furnace           # database, archive, backups
