# Furnace with Docker: two hosts, one container each, one shared IP (keepalived).
#
# Do not edit this file. Put your settings in the file .env next to it (copy .env.example to .env).
# The same two files go on both hosts, unchanged: each host finds its role from its own IP.
#
#   cp .env.example .env && nano .env      then:   docker compose up -d
#
# First start: the leader makes the certificate, the secrets and the follower bundle
# furnace-peer-bundle.tar.gz. Take it out with: docker cp furnace:/etc/furnace/furnace-peer-bundle.tar.gz ~/
# copy it to ./config/ on the follower host (it is secret; the follower deletes it after reading),
# delete your copy, then start the follower.
# Then make the first API token and the list login on the leader:
#   docker exec -it furnace furnace token add api
#   docker exec -it furnace furnace edl-user add paloalto
services:
  furnace:
    image: furnace:0.9.0
    container_name: furnace
    restart: unless-stopped
    network_mode: host            # keepalived moves the shared IP on the host's network card
    cap_add: [NET_ADMIN, NET_RAW] # only for the built-in keepalived; not needed with FURNACE_KEEPALIVED=external
    stop_grace_period: 20s
    env_file: .env                # all FURNACE_ settings and TZ
    volumes:
      - ./config:/etc/furnace     # certificate and secrets (keep it private)
      - ./data:/var/lib/furnace   # database, archive, backups
      - /run/furnace:/run/furnace-host  # FURNACE_KEEPALIVED=external only: the role from the host's keepalived
